# Прод: push в main → образ в GHCR → по SSH на сервер (docker pull + run). Git на сервере не нужен.
# Секреты репозитория: DEPLOY_HOST, DEPLOY_SSH_KEY (приватный ключ root@сервер).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key deploy/remote.sh "root@$DEPLOY_HOST:/tmp/deploy-gateway.sh"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" \
            "IMAGE='$IMAGE_TAG' NAME='marketplace-gateway' GHCR_USER='$GHCR_USER' \
             RUN_ARGS='-p 80:80 -p 443:443 -p 443:443/udp -v marketplace-caddy:/data -v marketplace-caddy-config:/config' HEALTH_URL='http://marketplace-gateway:80/healthz' bash /tmp/deploy-gateway.sh"
